<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InternHub - Sign Up</title>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="signupstyle.css">
</head>

<body>

  <!-- LEFT FORM -->
  <div class="left-section">
    <div class="signup-box">

      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-building-columns"></i>
        </div>
        <h2>InternHub</h2>
      </div>

      <h1>Create your account</h1>
      <p>Join thousands of students and companies</p>

      <form>
        <!-- Full Name -->
        <label>Full Name</label>
        <div class="input-box">
          <i class="fa-regular fa-user"></i>
          <input type="text" placeholder="John Doe" required />
        </div>

        <!-- Role -->
        <label>I am a</label>
        <div class="role-buttons">
          <button type="radio" name="role" id="student" class="role-btn student" checked>
            <i class="fa-regular fa-user"></i> Student
          </button>

          <button type="radio" name="role" id="company" class="role-btn company">
            <i class="fa-regular fa-building"></i> Company
          </button>

          <button type="radio" name="role" id="admin" class="role-btn admin">
            <i class="fa-solid fa-shield-halved"></i> Admin
          </button>
        </div>

        <!-- Email -->
        <label>Email</label>
        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="you@example.com" required />
        </div>

        <!-- Password -->
        <label>Password</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="••••••••" required />
        </div>

        <!-- Button -->
        <button class="btn" type="submit">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="signin-text">
          Already have an account? <a href="signin.html">Sign in</a>
        </div>
      </form>

    </div>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="right-section">
    <div class="right-content">
      <h1>Start Your Journey</h1>
      <p>
        Join our community of students and companies. <br>
        Find your perfect internship match today.
      </p>
    </div>
  </div>

</body>
</html>
